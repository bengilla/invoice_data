{% extends 'base.html' %}

{% block title %}
Invoice System - Login
{% endblock %}

{% block header %}
登入
{% endblock %}

{% block section %}
<form action="{{ login_data }}" method="POST">
    <div class="login">
        <input type="text" class="loginInput" name="username" placeholder="用户名" required>
        <input type="password" class="loginInput" name="password" placeholder="密码" required>
        <div class="center">
            <span class="small-font">如果还没注册，请转至"<a href="/register">注册</a>"</span><br />
        </div>
        <input type="submit" class="submitButton" value="确认">
    </div>
    {% if msg != [] %}
    {% for err in msg %}
    <script>
        alert("{{ err }}")
    </script>
    {% endfor %}
    {% endif %}
</form>
{% endblock %}

{% block footer %}
发票系统
{% endblock %}
