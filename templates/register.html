{% extends 'base.html' %}

{% block title %}
Invoice System - Register
{% endblock %}

{% block section %}
<form action="{{ register_data }}" method="POST" enctype="multipart/form-data">
    <div class="center">
        <span>注册</span><br />
        <input type="text" name="username" placeholder="用户名" required oninvalid="this.setCustomValidity('请输入用户名')"><br />
        <input type="password" name="password" placeholder="密码" required oninvalid="this.setCustomValidity('请输入密码')"><br />
        <input type="text" name="code" placeholder="确认码" required oninvalid="this.setCustomValidity('请输入确认码')"><br />
        <span class="small_font">已注册，请转至"<a href="/login">登入</a>"</span><br />
        <button type="submit">确认</button>
    </div>
    {% if error_msg %}
    <script>
        alert("{{ error_msg }}")
    </script>
    {% endif %}
</form>
{% endblock %}
