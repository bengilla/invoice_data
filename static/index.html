    <div class="container">
        <h1 style="display: flex; justify-content: center; align-items: center; gap: 12px;">
            <span style="font-size: 42px; animation: float 3s ease-in-out infinite;">📋</span>
            <span>报销达人</span>
        </h1>
        <p id="subtitle" class="header-subtitle" style="text-align: center; margin-bottom: 28px; font-size: 16px;"></p>

        <div style="display:flex;gap:12px;margin-bottom:28px;">
            <div id="upload-area" class="upload-area" style="flex:4;margin-bottom:0;" onclick="document.getElementById('folder-input').click()">
                <div class="upload-icon">📁</div>
                <p class="upload-text">点击选择文件夹 或 拖拽文件到这里</p>
                <p class="upload-hint">支持 PDF / PNG / JPG / BMP / GIF 格式发票文件</p>
                <input type="file" id="folder-input" multiple accept=".pdf,.png,.jpg,.jpeg,.bmp,.gif">
            </div>
            <button class="clear-btn" id="clear-btn" style="display:none;flex:1;margin-bottom:0;padding:16px 12px;white-space:nowrap;" onclick="clearAllData()">🗑️ 清除所有数据</button>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">发票总数</div>
                <div class="stat-value" id="invoice-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">其他发票</div>
                <div class="stat-value" id="summary-other" name="total_other_invoice">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总金额</div>
                <div class="stat-value" id="total-amount">¥0</div>
                <div id="amount-upper" name="chinese_price" style="font-size:11px;margin-top:4px;font-weight:400;">-</div>
            </div>
        </div>

        <div id="buyer-section" class="buyer-section" style="display: none;">
            <div class="buyer-title">购买方筛选</div>
            <div id="buyer-buttons" class="buyer-buttons"></div>
        </div>

        <div id="month-list"></div>

        <div id="meta-form" style="display:none;margin-bottom:20px;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                <div>
                    <label style="font-size:13px;display:block;margin-bottom:6px;">报销人<span style="color:#E07B6B;"> *</span></label>
                    <input name="name" type="text" placeholder="请输入报销人" required style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
                </div>
                <div>
                    <label style="font-size:13px;display:block;margin-bottom:6px;">日期</label>
                    <input name="date" type="text" readonly style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;outline:none;cursor:default;">
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div>
                    <label style="font-size:13px;display:block;margin-bottom:6px;">报销部门</label>
                    <input name="department" type="text" placeholder="请输入报销部门" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
                </div>
                <div>
                    <label style="font-size:13px;display:block;margin-bottom:6px;">所属岗位</label>
                    <input name="position" type="text" placeholder="请输入所属岗位" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
                </div>
            </div>
        </div>

        <button id="download-all-btn" class="download-btn" style="display:none;margin-top:24px;" onclick="downloadAllInvoices()">
            📥 下载全部发票
        </button>
    </div>

    <footer>© 2026 报销达人</footer>

    <canvas id="crystal-counter"></canvas>

    <div id="toast" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);background:var(--card);border:2px solid var(--primary);border-radius:16px;padding:32px 40px;text-align:center;box-shadow:0 20px 50px rgba(0, 0, 0, 0.5);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);opacity:0;min-width:280px;z-index:2000;">
        <div style="font-size:40px;margin-bottom:12px;">✨</div>
        <div id="toast-msg" style="font-size:16px;font-weight:600;color:var(--text);line-height:1.5;"></div>
    </div>
    <div id="toast-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0, 0, 0, 0.6);opacity:0;transition:opacity 0.3s;z-index:1999;"></div>

    <div id="pdf-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="pdf-preview" style="width:100%;height:85vh;"></div>
        </div>
    </div>

    <div id="other-item-modal" class="modal">
        <div class="modal-content" style="max-width:400px;padding:24px;">
            <span class="modal-close" onclick="closeOtherItemModal()">&times;</span>
            <h3 style="margin-bottom:16px;color:var(--text);">请输入事项内容</h3>
            <input type="text" id="other-item-input" placeholder="请输入事项" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;margin-bottom:16px;" onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'" onkeydown="if(event.key==='Enter')confirmOtherItem()">
            <button onclick="confirmOtherItem()" style="width:100%;padding:10px 14px;border-radius:10px;border:none;background:var(--primary);color:white;font-size:14px;font-weight:600;cursor:pointer;">确定</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/crystal-counter.js"></script>
    <script>initCrystalCounter();</script>

</html>
