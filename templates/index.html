{% extends 'base.html' %}
{% block title %}Login Page{% endblock %}

{% block header %}
<div class="text-center">
    <div class="p-1">
        <span class="text-2xl">发票整理系统</span>
    </div>
    <div>
        <a href="/register" class="text-xs text-orange-400 hover:text-red-400 hover:underline">注册</a>
    </div>
</div>
{% endblock %}

{% block section %}
<form action="/" method="post" enctype="multipart/form-data">
    <div class="w-60 grid place-content-center gap-y-2">
        <div>
            <input type="email" name="email" class="w-full text-slate-800 text-center placeholder:italic placeholder:text-slate-400 placeholder:text-xs bg-white border border-slate-300 rounded-md py-2 px-6 shadow-sm focus:outline-none focus:border-sky-500 focus:ring-sky-500 focus:ring-1 sm:text-sm" placeholder="邮箱"><br>
        </div>
        <div>
            <input type="password" name="password" class="w-full text-slate-800 text-center placeholder:italic placeholder:text-slate-400 placeholder:text-xs bg-white border border-slate-300 rounded-md py-2 px-6 shadow-sm focus:outline-none focus:border-sky-500 focus:ring-sky-500 focus:ring-1 sm:text-sm" placeholder="密码">
        </div>
        <div>
            <input type="submit" value="确认" class="w-60 py-2 px-2 text-xs text-slate-900 rounded-lg bg-blue-300 hover:bg-blue-500">
        </div>
    </div>
</form>
{% endblock %}
