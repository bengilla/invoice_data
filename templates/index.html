<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Bill Calculate</title>
</head>

<body>
    <div class="px-2 grid place-content-center">
        <!-- header -->
        <div class="w-full my-4 grid place-content-center">
            <span class="text-4xl font-bold">Invoice Calculate</span>
        </div>

        <div class="flex">
            {% for i in list_col%}
            <div class="m-1 pb-2">
                <a href="{{ i }}">
                    <div class="w-[2rem] p-2 grid place-content-center border border-1 border-slate-800 rounded hover:bg-slate-300 ease-in-out">
                        {{ i }}
                    </div>
                </a>
            </div>
            {% endfor%}
        </div>

        <!-- body -->
        <div class="border-2 border-orange-500 rounded-lg">
            <!-- thead -->
            <div class="w-full flex bg-orange-500 text-slate-100">
                <div class="w-[10%] p-2 grid place-content-center">pdf</div>
                <div class="w-[25%] p-2 grid place-content-center border-r border-dotted border-orange-500">date</div>
                <div class="w-[35%] p-2 grid place-content-center border-r border-dotted border-orange-500">code</div>
                <div class="w-[30%] p-2 grid place-content-center">amount</div>
            </div>
            <!-- tbody -->
            {% for i in data %}
            <div class="w-full flex text-sm border-b border-dotted border-orange-500">
                <div class="w-[10%] p-1 grid place-content-center border-r border-dotted border-orange-500">
                    {% if i.pdf %}
                    <img src="{{ url_for('static', path='image/pdf.png') }}" alt="PDF image" width="20px">
                    {% endif %}
                </div>
                <div class="w-[25%] p-1 grid place-content-center border-r border-dotted border-orange-500">{{ i.date }}</div>
                <div class="w-[35%] p-1 grid place-content-center border-r border-dotted border-orange-500">{{ i._id }}</div>
                <div class="w-[30%] p-1 grid place-content-center">{{ i.amount }}</div>
            </div>
            {% endfor%}
            <!-- tbottom -->
            <div class="w-full flex text-sm">
                <div class="w-[10%] p-2 grid place-content-center"></div>
                <div class="w-[25%] p-2 grid place-content-center"></div>
                <div class="w-[35%] p-2 grid place-content-center border-r border-dotted border-orange-500"></div>
                <div class="w-[30%] p-2 grid place-content-center font-bold">{{ total }}</div>
            </div>
        </div>

        {% if msg%}
        <div class="p-2 px-2 mt-4 text-slate-50 font-bold bg-red-400 rounded-full grid place-content-center">{{ msg }}</div>
        {% endif %}

        <!-- form -->
        <div class="w-full mt-4 grid place-content-center">
            <form action="{{ send_file }}" method="POST" enctype="multipart/form-data">
                <!-- QRCode -->
                <div class="flex">
                    <div>
                        <div class="text-sm text-slate-500">QRCode</div>
                        <input type="file" name="qrcode_image" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100" required>
                    </div>
                    <!-- File -->
                    <div>
                        <div class="text-sm text-slate-500">PDF</div>
                        <input type="file" name="pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100" required>
                    </div>
                </div>
                <!-- Submit -->
                <div>
                    <input type="submit" class="w-full rounded-full p-1 mt-3 border border-2 border-slate-400 hover:bg-orange-500 hover:text-slate-50 hover:border-orange-500 ease-in-out">
                </div>
            </form>
        </div>

        <!-- footer -->
    </div>
</body>

</html>
