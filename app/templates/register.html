{% extends 'base.html' %}
{% block title %}Register Page{% endblock %}

{% block header %}
<div class="text-center">
    <div class="p-1">
        <span class="text-2xl">注册</span>
    </div>
    <div>
        <a href="/" class="text-xs text-orange-400 hover:text-red-400 hover:underline">回主页</a>
    </div>
</div>
{% endblock %}

{% block section %}
<form action="/register" method="post" enctype="multipart/form-data">
    <div class="w-60 grid place-content-center gap-y-2">
        <div>
            <input type="email" name="email" class="w-full text-slate-800 text-center placeholder:italic placeholder:text-slate-400 placeholder:text-xs bg-white border border-slate-300 rounded-md py-2 px-6 shadow-sm focus:outline-none focus:border-sky-500 focus:ring-sky-500 focus:ring-1 sm:text-sm" placeholder="邮箱" required><br>
        </div>

        <div>
            <input type="password" name="password" class="w-full text-slate-800 text-center placeholder:italic placeholder:text-slate-400 placeholder:text-xs bg-white border border-slate-300 rounded-md py-2 px-6 shadow-sm focus:outline-none focus:border-sky-500 focus:ring-sky-500 focus:ring-1 sm:text-sm" placeholder="密码" required>
        </div>

        <div>
            <input type="text" name="code" class="w-full text-slate-800 text-center placeholder:italic placeholder:text-slate-400 placeholder:text-xs bg-white border border-slate-300 rounded-md py-2 px-6 shadow-sm focus:outline-none focus:border-sky-500 focus:ring-sky-500 focus:ring-1 sm:text-sm" placeholder="确认号码" required>
        </div>

        <div>
            <input type="submit" value="确认" class="w-60 py-2 px-2 text-xs text-slate-900 rounded-lg bg-blue-300 hover:bg-blue-500">
        </div>
    </div>
</form>
{% endblock %}
