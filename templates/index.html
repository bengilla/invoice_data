<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Bill Calculate</title>
</head>

<body>
    <div class="w-full my-4 grid place-content-center">
        <!-- header -->
        <div class="w-full my-4 grid place-content-center">
            <span class="text-4xl font-bold">Bill Calculate</span>
        </div>

        <div class="flex">
            {% for i in list_col%}
            <div class="m-1 pb-2">
                <a href="{{ i }}">
                    <div class="w-[2rem] p-2 grid place-content-center border border-1 border-slate-800 rounded-lg hover:bg-slate-300 ease-in-out">
                        {{ i }}
                    </div>
                </a>
            </div>
            {% endfor%}
        </div>

        <!-- body -->
        <div class="w-full border-2 border-orange-500 grid place-content-center rounded-t-lg rounded-b-lg">
            <!-- thead -->
            <div class="flex bg-orange-500 text-slate-100">
                <div class="w-[130px] p-2 grid place-content-center border-r border-dotted border-orange-500">date</div>
                <div class="w-[200px] p-2 grid place-content-center border-r border-dotted border-orange-500">code</div>
                <div class="w-[150px] p-2 grid place-content-center">amount</div>
            </div>
            <!-- tbody -->
            {% for i in data %}
            <div class="flex text-sm border-b border-dotted border-orange-500">
                <div class="w-[130px] p-1 grid place-content-center border-r border-dotted border-orange-500">{{ i.date }}</div>
                <div class="w-[200px] p-1 grid place-content-center border-r border-dotted border-orange-500">{{ i._id }}</div>
                <div class="w-[150px] p-1 grid place-content-center">{{ i.amount }}</div>
            </div>
            {% endfor%}
            <!-- tbottom -->
            <div class="flex text-sm">
                <div class="w-[130px] p-2 grid place-content-center"></div>
                <div class="w-[200px] p-2 grid place-content-center border-r border-dotted border-orange-500"></div>
                <div class="w-[150px] p-2 grid place-content-center font-bold">{{ total }}</div>
            </div>
        </div>

        <!-- form -->
        <div class="my-4 grid place-content-center">
            <form action="{{ send_file }}" method="POST" enctype="multipart/form-data">
                <input type="file" name="image">
                <input type="submit" class="border border-2 border-slate-400 p-1 px-4">
            </form>
        </div>

        <!-- footer -->
    </div>
</body>

</html>
