<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/js/jquery-3.6.4.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="/static/images/favicon.ico">
    <title>{% block title %}{% endblock %}</title>
</head>


<body>
    <header>
        {% block header %}{% endblock %}
    </header>
    <section>
        {%block section %}{% endblock %}
    </section>
    <footer>
        {% block footer %}{% endblock %}
    </footer>
</body>

<script>
    // checkbox function
    function toggle(source) {
        $('input[name="ids"]').prop('checked', source.checked);
    }


    // if un-uncheck single checkbox, select all checkbox with disable
    function single(source) {
        checkboxes = $("[name='ids']");
        single_row = $(".single_row")
        let count = 0;

        for (var i = 0, n = checkboxes.length; i < n; i++) {
            if (checkboxes[i].type === "checkbox" && checkboxes[i].checked === true) {
                count++;
            }
        }
        if (checkboxes.length > count) {
            document.getElementById("main-checkbox").checked = false;
        } else {
            document.getElementById("main-checkbox").checked = true;
        }
    }

    // url pathname
    let url = location.pathname;
    console.log(url)

    // if empty hide title box (jquery)
    const title = $("#title-box");
    if (url === "/month/0" || url === "/month/None") {
        title.css("display", "");
    } else {
        title.css("display", "");
    }

    // button color
    var selector = "#" + $.escapeSelector(url);
    var btn = $(selector);
    btn.css({
        "background-color": "#f97316",
        "border-color": "#f97316",
        "color": "#fff"
    });

    // fadeout (jquery) test
    var errorElements = $(".error");
    if (errorElements.length) { // check if any elements were found
        setTimeout(function () {
            errorElements.each(function () {
                $(this).fadeOut("fast", function () {
                    $(this).remove();
                });
            });
        }, 8000);
    }

</script>

</html>
