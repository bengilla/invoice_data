{% extends 'base.html' %}

{% block title %}
Invoice System - Register
{% endblock %}

{% block section %}
<form action="{{ register_data }}" method="POST" enctype="multipart/form-data">
    <div class="center">
        <span>注册</span><br />
        <input type="text" name="username" placeholder="用户名" required><br />
        <input type="password" name="password" placeholder="密码" required><br />
        <input type="text" name="code" placeholder="确认码" required><br />
        <span class="small_font">已注册，请转至"<a href="/login">登入</a>"</span><br />
        <input type="submit" class="btn" value="确认">
    </div>
    {% if msg != [] %}
    {% for err in msg %}
    <script>
        alert("{{ err }}")
    </script>
    {% set _ = msg.remove(err) %}
    {% endfor %}
    {% endif %}
</form>
{% endblock %}
